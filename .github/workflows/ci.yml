name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall src

      - name: Check release script syntax
        run: bash -n scripts/release.sh

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint Helm chart
        run: helm lint charts/paperless-wsd-bridge

      - name: Render Helm chart
        run: helm template paperless-wsd-bridge charts/paperless-wsd-bridge

      - name: Build container image
        run: docker build --pull=false -t paperless-wsd-bridge:test .
