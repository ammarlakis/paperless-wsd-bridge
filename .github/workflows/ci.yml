name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall src

      - name: Check release script syntax
        run: bash -n scripts/release.sh

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm chart
        run: helm lint charts/paperless-wsd-bridge

      - name: Render Helm chart
        run: helm template paperless-wsd-bridge charts/paperless-wsd-bridge

      - name: Build container image
        run: docker build --pull=false -t paperless-wsd-bridge:test .
