apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless-wsd-bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperless-wsd-bridge.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "paperless-wsd-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-wsd
      port: {{ .Values.service.port }}
      targetPort: http-wsd
      protocol: TCP
      appProtocol: http
